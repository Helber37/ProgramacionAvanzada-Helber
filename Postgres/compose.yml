# PostgreSQL & pgadmin4

services:
  db:
    image: postgres:latest
    container_name: postgres_programacion_avanzada
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - pgnetwork
    cpus: "2"           # hasta 2.5 CPU lógicas
    mem_limit: 1g         # límite duro
    mem_reservation: 512m # “soft” para planificación

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_programacion_avanzada
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - pgnetwork
    cpus: "2"           # hasta 2.5 CPU lógicas
    mem_limit: 1g         # límite duro
    mem_reservation: 512m # “soft” para planificación

networks:
  pgnetwork:
