<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Reservas{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="barra">
    <a class="marca" href="{{ url_for('inicio') }}">Reserva de espacios</a>
    {% if session.usuario_id %}
    <nav>
      <a href="{{ url_for('reservar') }}">Reservar</a>
      <a href="{{ url_for('mis_reservas') }}">Mis reservas</a>
      <a href="{{ url_for('logout') }}">Salir ({{ session.nombre }})</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% for categoria, msg in get_flashed_messages(with_categories=true) %}
      <p class="aviso {{ categoria }}" role="alert">{{ msg }}</p>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
