[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  # Sin tag "host": el hostname del contenedor cambia al recrearlo y generaría series nuevas
  omit_hostname = true

# --- Entrada: EMQX (MQTT) ------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  # sensors/# → emulador (emulando_HA.sh / emulador_sensores)
  topics = ["iot/data/#", "sensors/#"]
  data_format = "json"
  tag_keys = [
    "device",
    "sede",
    "sensor_id",
    "metric",
    "unit"
  ]
  topic_tag = "topic"
  qos = 0
  client_id = "telegraf-mqtt"
  # Vacíos = conexión anónima (EMQX por defecto no exige autenticación)
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"

# --- Salida: VictoriaMetrics (protocolo InfluxDB line protocol en /write) ------
# VictoriaMetrics nombra cada serie como <measurement>_<field>,
# p. ej. mqtt_consumer_temperature{device="sensor-1",topic="sensors/sensor-1/data",db="iot"}
[[outputs.influxdb]]
  urls = ["http://victoriametrics:8428"]
  database = "iot"
  skip_database_creation = true
  content_encoding = "gzip"
