# ==============================================================================
# Alertas por umbral (Python) -> EMQX del stack ../compose.yml
# Levanta primero el stack principal; este se conecta al puerto MQTT publicado
# en el host (EMQX_MQTT_PORT del ../.env) y envía correos vía Gmail.
#
#   docker compose up -d --build
#   docker compose logs -f
# ==============================================================================

services:
  alertas:
    build: .
    image: alertas-umbral:latest
    container_name: alertas-umbral
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Conectamos por la red interna de Docker, no por el puerto publicado
      # en el host: usamos el nombre del servicio EMQX y su puerto interno.
      MQTT_HOST: emqx
      MQTT_PORT: 1883
    networks:
      - iot-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  iot-network:
    name: iot_emqx_iot-network
    external: true